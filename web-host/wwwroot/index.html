<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101722"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"><title>OpenDisplay · Pen Tablet</title></head>
<body><main>
<header><span class="badge">OpenDisplay Web · Preview</span><h1>把 iPad 變成手寫板</h1><p id="status" role="status">請先配對 Windows 主機。</p></header>
<section id="pairing"><label>主機顯示的配對碼 <input id="code" autocomplete="off" maxlength="12" spellcheck="false"></label><button id="pair">配對</button><p>首次輸入後，在 Windows 主機輸入 approve。此瀏覽器會記住授權 30 天，重啟不必重新配對。</p></section>
<section id="settings" hidden>
<label>模式 <select id="mode"><option value="pen">Pen Tablet · 純手寫</option><option value="mirror">Mirror · 鏡像既有螢幕</option><option value="extend">Extend · 新增延伸螢幕</option></select></label>
<label id="targetField">控制的 Windows 螢幕 <select id="target"><option value="">請選擇螢幕</option></select></label>
<div id="panelFields" hidden><label>延伸螢幕寬度（像素）<input id="panelWidth" type="number" min="640" max="4096" step="2" value="2360"></label><label>延伸螢幕高度（像素）<input id="panelHeight" type="number" min="480" max="4096" step="2" value="1640"></label><p>此解析度必須先在 Windows 註冊。旋轉 iPad 時會自動交換寬高並重建 Extend。</p></div>
<label>映射方式 <select id="mapping"><option value="preserve">保持比例（建議）</option><option value="stretch">使用整個表面（拉伸）</option></select></label>
<div id="penFields"><label>手寫板背景 <select id="penBackground"><option value="dark">深色</option><option value="black">純黑</option><option value="white">白色</option></select></label><label class="check"><input id="showActiveArea" type="checkbox" checked>顯示有效區邊界</label><label class="check"><input id="showHover" type="checkbox" checked>顯示 Apple Pencil Hover 指示器</label></div>
<label id="fpsField" hidden>影片幀率 <select id="fps"><option value="30">30 FPS</option><option value="60">60 FPS</option></select></label>
<label id="qualityField" hidden>影片品質 <select id="quality"><option value="balanced">平衡 · 12 Mbps</option><option value="fast">省頻寬 · 4 Mbps</option><option value="high">高畫質 · 24 Mbps</option></select></label>
<label>手指輸入 <select id="fingerMode"><option value="off">關閉（預設）</option><option value="trackpad">Touchpad · 相對移動與手勢</option><option value="touch">觸控螢幕 · Windows Touch</option></select></label>
<label id="sensitivityField" hidden>Touchpad 靈敏度 <select id="trackpadSensitivity"><option value="slow">慢速 · 0.75×</option><option value="normal" selected>標準 · 1.25×</option><option value="fast">快速 · 2×</option></select></label>
<label>壓力曲線 <select id="pressureCurve"><option value="linear">原始壓力</option><option value="soft">輕壓即可加粗</option><option value="firm">重壓才加粗</option></select></label>
<button id="start">開始</button><button id="refresh">重新整理螢幕</button><button id="forget">忘記此裝置</button><p>Touchpad：單指移動／點按、雙點與拖曳、雙指捲動／右鍵。觸控螢幕：最多五指直接傳給 Windows。Pencil 使用時會抑制手掌誤觸。</p></section>
<section id="tablet" hidden><div class="toolbar"><span id="destination"></span><button id="stop">停止</button></div><div id="surface" data-background="dark"><div id="activeArea"></div><div id="hoverIndicator"></div><span class="hint">看著電腦螢幕，在這裡書寫<br>不傳送桌面影像，也不顯示本地筆跡</span></div></section>
</main><script type="module" src="/app.js"></script></body></html>
